name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-popote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Format & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm test

  build:
    name: Build & push GHCR
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 uniquement : c'est l'architecture des Serverless Containers.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redéploiement Scaleway
    needs: build
    runs-on: ubuntu-latest

    # Étapes sautées sans secrets d'infrastructure : à l'amorçage, l'image doit
    # exister sur GHCR avant que Terraform (dépôt Kompas) crée le container et
    # fournisse son ID. Le test passe par `env`, le contexte `secrets` n'étant
    # pas autorisé dans un `if`.
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
      REGION: ${{ secrets.SCW_REGION }}

    steps:
      - name: Vérifier la présence des secrets d'infrastructure
        if: env.CONTAINER_ID == ''
        run: echo "::notice::Secrets d'infrastructure absents, deploiement saute."

      # Terraform déclare l'image en `:latest` et n'est jamais exécuté ici : il
      # suffit de demander à Scaleway de re-tirer le tag.
      - name: Déclencher le redéploiement
        if: env.CONTAINER_ID != ''
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${CONTAINER_ID}/redeploy" \
            > /dev/null
          echo "Redéploiement demandé."

      # L'appel de redéploiement est asynchrone : sans cette attente, la CI
      # serait verte même si le container ne démarre pas.
      - name: Attendre que le container soit prêt
        if: env.CONTAINER_ID != ''
        run: |
          set -euo pipefail
          url="https://api.scaleway.com/containers/v1/regions/${REGION}/containers/${CONTAINER_ID}"
          for attempt in $(seq 1 40); do
            body=$(curl --fail-with-body --silent --show-error -H "X-Auth-Token: ${SCW_SECRET_KEY}" "$url")
            status=$(echo "$body" | jq -r '.status')
            echo "[$attempt/40] status=$status"
            case "$status" in
              ready) echo "Container en ligne."; exit 0 ;;
              error) echo "::error::Le déploiement a échoué : $(echo "$body" | jq -r '.error_message')"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Le container n'est pas devenu 'ready' en 10 minutes."
          exit 1
