name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, tests & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      # deploy.yml ne se déclenche que sur `main` : sans cette étape, une erreur
      # dans ce fichier ne serait découverte qu'après le merge.
      - name: Lint des workflows GitHub Actions
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

      # Une PR qui casse le Dockerfile doit échouer ici plutôt qu'au merge.
      - name: Build de contrôle de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
